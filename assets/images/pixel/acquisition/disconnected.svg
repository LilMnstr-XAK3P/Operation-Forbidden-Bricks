<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Acquisition: disconnected</title><g shape-rendering="crispEdges"><rect x="0" y="0" width="1200" height="520" fill="#081321"/><rect x="4" y="4" width="1192" height="512" fill="#efb84e"/><rect x="8" y="8" width="1184" height="504" fill="#14273e"/><text x="38" y="50" fill="#fff0cb" font-family="monospace" font-size="26" text-anchor="start">SOLEPRINT / STORAGE ACQUISITION</text><text x="38" y="84" fill="#fff0cb" font-family="monospace" font-size="18" text-anchor="start">Connect the source through the write blocker.</text><g transform="translate(85 150) scale(4)"><rect x="5" y="3" width="22" height="26" fill="#081321"/><rect x="7" y="5" width="18" height="22" fill="#a7b6c8"/><rect x="9" y="7" width="14" height="10" fill="#fff0cb"/><rect x="9" y="21" width="14" height="3" fill="#14273e"/><rect x="10" y="26" width="3" height="3" fill="#efb84e"/><rect x="16" y="26" width="6" height="3" fill="#efb84e"/></g><text x="150" y="320" fill="#fff0cb" font-family="monospace" font-size="17" text-anchor="middle">SOURCE DRIVE</text><g transform="translate(365 150) scale(4)"><rect x="2" y="8" width="28" height="19" fill="#233d55"/><rect x="4" y="10" width="24" height="3" fill="#efb84e"/><rect x="5" y="21" width="6" height="3" fill="#5cc8ed"/><rect x="15" y="21" width="9" height="3" fill="#a7b6c8"/><rect x="14" y="15" width="6" height="4" fill="#efb84e"/></g><text x="430" y="320" fill="#fff0cb" font-family="monospace" font-size="17" text-anchor="middle">WRITE BLOCKER</text><g transform="translate(665 150) scale(4)"><rect x="2" y="4" width="28" height="24" fill="#a7b6c8"/><rect x="4" y="6" width="24" height="20" fill="#081321"/><path d="M7 10H10V13H13V16H10V19H7V16H10V13H7Z" fill="#7bd3a1"/><rect x="16" y="18" width="9" height="2" fill="#7bd3a1"/></g><text x="730" y="320" fill="#fff0cb" font-family="monospace" font-size="17" text-anchor="middle">ACQUISITION HOST</text><g transform="translate(965 150) scale(4)"><rect x="7" y="3" width="18" height="26" fill="#081321"/><rect x="9" y="5" width="14" height="22" fill="#5cc8ed"/><rect x="11" y="7" width="10" height="3" fill="#fff0cb"/><rect x="11" y="22" width="6" height="2" fill="#14273e"/><rect x="20" y="22" width="2" height="2" fill="#7bd3a1"/></g><text x="1030" y="320" fill="#fff0cb" font-family="monospace" font-size="17" text-anchor="middle">DESTINATION</text><path d="M223 218H365" fill="none" stroke="#a7b6c8" stroke-width="8" stroke-dasharray="10 10"/><path d="M503 218H665" fill="none" stroke="#a7b6c8" stroke-width="8" stroke-dasharray="10 10"/><path d="M803 218H965" fill="none" stroke="#a7b6c8" stroke-width="8" stroke-dasharray="10 10"/><text x="40" y="380" fill="#fff0cb" font-family="monospace" font-size="17" text-anchor="start">Source is read through the blocker. The destination receives the image.</text><text x="40" y="414" fill="#a7b6c8" font-family="monospace" font-size="16" text-anchor="start">Schematic data path; power connections omitted.</text><rect x="40" y="450" width="1120" height="24" fill="#233d55"/></g></svg>